appId: app.specdrive
productName: SpecDrive
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - '!out/mcp/**'
extraResources:
  - from: out/mcp
    to: mcp
# Updates + downloads are served from the PUBLIC site repo — the app source
# repo stays private, and a private feed would break auto-update for users.
publish:
  provider: github
  owner: Connected-Mate
  repo: specdrive-site
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
