<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Perfectly Nineties';
    src: url('../src/renderer/public/fonts/perfectly-nineties.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Portal Sans';
    src: url('../src/renderer/public/fonts/ui-sans-600.woff2') format('woff2');
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; background: transparent; }

  .icon {
    width: 1024px; height: 1024px;
    display: grid; place-items: center;
    border-radius: 232px;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(140% 100% at 22% 6%, rgba(255,255,255,0.40), transparent 46%),
      radial-gradient(120% 90% at 88% 96%, rgba(255,196,140,0.55), transparent 52%),
      linear-gradient(158deg, #3f74ef 0%, #6d75dd 30%, #a87fc6 56%, #d38fae 78%, #ecab7c 100%);
  }
  /* Depth: a wide soft light sweep, blurred — the surface has air in it */
  .icon::before {
    content: '';
    position: absolute;
    left: -18%; top: -32%; width: 136%; height: 86%;
    background: radial-gradient(closest-side, rgba(255,255,255,0.45), transparent 72%);
    filter: blur(58px);
    transform: rotate(-12deg);
  }
  /* Film grain over everything, subtle — kills the flat plastic look */
  .grain {
    position: absolute; inset: 0; z-index: 5;
    opacity: 0.20;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='220' height='220' filter='url(%23n)'/></svg>");
    background-size: 220px 220px;
  }
  /* Bottom-left dusk depth so the card reads as floating */
  .vignette {
    position: absolute; inset: 0; z-index: 4;
    background: radial-gradient(120% 92% at 50% 118%, rgba(30,32,72,0.42), transparent 58%);
  }

  .stamp {
    position: relative;
    z-index: 6;
    background: #fff;
    border-radius: 64px;
    padding: 62px 76px 70px;
    box-shadow:
      0 6px 0 0 rgba(255,255,255,0.55) inset,
      0 46px 96px rgba(26, 26, 66, 0.40),
      0 10px 26px rgba(26, 26, 66, 0.22);
    transform: rotate(-6.5deg) translate(-14px, -22px);
  }
  .word {
    font-family: 'Perfectly Nineties', Georgia, serif;
    font-size: 132px;
    line-height: 0.86;
    color: #0a0a0a;
    white-space: nowrap;
  }
  .cursor { position: absolute; right: -34px; bottom: -30px; z-index: 7; filter: drop-shadow(0 10px 18px rgba(26,26,66,0.32)); }
  .pill {
    position: absolute;
    right: -108px; bottom: -74px;
    font-family: 'Portal Sans', -apple-system, sans-serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: -0.02em;
    color: #fff;
    background: #7b7ed8;
    border-radius: 100px;
    padding: 12px 27px 14px;
    box-shadow: 0 16px 34px rgba(26,26,66,0.34);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="vignette"></div>
    <div class="stamp">
      <div class="word">SpecDrive</div>
      <svg class="cursor" width="96" height="96" viewBox="0 0 24 24" fill="none">
        <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87c.48 0 .72-.58.38-.92L5.94 2.47a.5.5 0 0 0-.44.74Z"
              fill="#7b7ed8" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      <div class="pill">agents</div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
